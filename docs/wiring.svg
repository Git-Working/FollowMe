<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#090d16" rx="16"/>

  <text x="450" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#ffffff" font-weight="700">
    ESP32-C3 Mini + INMP441 I2S Microphone Wiring Diagram
  </text>
  <text x="450" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">
    Direct pinout for acoustic clap detection &amp; room presence tracking
  </text>

  <!-- INMP441 Module (Left) -->
  <g transform="translate(100, 110)" filter="url(#shadow)">
    <rect width="220" height="300" rx="14" fill="#475569" stroke="#64748b" stroke-width="2"/>
    <rect x="15" y="15" width="190" height="270" rx="10" fill="#1e1e24"/>
    
    <!-- Mic Hole -->
    <circle cx="110" cy="65" r="18" fill="#d4af37" stroke="#aa8c2c" stroke-width="2"/>
    <circle cx="110" cy="65" r="6" fill="#000000"/>
    <text x="110" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#ffffff" font-weight="700">INMP441</text>
    <text x="110" y="122" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">I2S Microphone</text>

    <!-- Pins -->
    <g transform="translate(30, 150)" font-family="monospace" font-size="13" font-weight="bold">
      <!-- VDD -->
      <circle cx="150" cy="15" r="7" fill="#ef4444"/>
      <text x="130" y="20" text-anchor="end" fill="#fca5a5">VDD (3.3V)</text>

      <!-- GND -->
      <circle cx="150" cy="40" r="7" fill="#000000" stroke="#64748b" stroke-width="2"/>
      <text x="130" y="45" text-anchor="end" fill="#cbd5e1">GND</text>

      <!-- SD -->
      <circle cx="150" cy="65" r="7" fill="#3b82f6"/>
      <text x="130" y="70" text-anchor="end" fill="#93c5fd">SD (Data)</text>

      <!-- L/R -->
      <circle cx="150" cy="90" r="7" fill="#10b981"/>
      <text x="130" y="95" text-anchor="end" fill="#a7f3d0">L/R (GND)</text>

      <!-- WS -->
      <circle cx="150" cy="115" r="7" fill="#eab308"/>
      <text x="130" y="120" text-anchor="end" fill="#fde047">WS (Word/LR)</text>

      <!-- SCK -->
      <circle cx="150" cy="140" r="7" fill="#a855f7"/>
      <text x="130" y="145" text-anchor="end" fill="#d8b4fe">SCK (Clock)</text>
    </g>
  </g>

  <!-- Wires -->
  <g stroke-width="3" stroke-linecap="round" fill="none">
    <!-- VDD: Red -->
    <path d="M 280 275 C 380 275, 460 210, 580 210" stroke="#ef4444"/>
    
    <!-- GND: Black/Slate -->
    <path d="M 280 300 C 370 300, 480 235, 580 235" stroke="#64748b"/>

    <!-- SD -> GPIO 4: Blue -->
    <path d="M 280 325 C 400 325, 470 335, 580 335" stroke="#3b82f6"/>

    <!-- L/R -> GND: Green to Ground -->
    <path d="M 280 350 C 340 350, 420 250, 580 235" stroke="#10b981" stroke-dasharray="4,4"/>

    <!-- WS -> GPIO 3: Yellow -->
    <path d="M 280 375 C 420 375, 470 310, 580 310" stroke="#eab308"/>

    <!-- SCK -> GPIO 2: Purple -->
    <path d="M 280 400 C 440 400, 490 285, 580 285" stroke="#a855f7"/>
  </g>

  <!-- ESP32-C3 Mini (Right) -->
  <g transform="translate(580, 110)" filter="url(#shadow)">
    <rect width="220" height="300" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <rect x="15" y="15" width="190" height="270" rx="10" fill="#064e3b" stroke="#047857" stroke-width="1.5"/>

    <!-- Chip Plate -->
    <rect x="40" y="35" width="140" height="100" rx="6" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="110" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#0f172a" font-weight="800">ESP32-C3</text>
    <text x="110" y="98" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155" font-weight="600">Mini Dev Board</text>

    <!-- Pins -->
    <g transform="translate(0, 150)" font-family="monospace" font-size="13" font-weight="bold">
      <!-- 3.3V -->
      <circle cx="0" cy="-50" r="7" fill="#ef4444"/>
      <text x="20" y="-45" fill="#fca5a5">3V3</text>

      <!-- GND -->
      <circle cx="0" cy="-25" r="7" fill="#000000" stroke="#64748b" stroke-width="2"/>
      <text x="20" y="-20" fill="#cbd5e1">GND</text>

      <!-- GPIO 2 -->
      <circle cx="0" cy="25" r="7" fill="#a855f7"/>
      <text x="20" y="30" fill="#d8b4fe">GPIO 2 (SCK)</text>

      <!-- GPIO 3 -->
      <circle cx="0" cy="50" r="7" fill="#eab308"/>
      <text x="20" y="55" fill="#fde047">GPIO 3 (WS)</text>

      <!-- GPIO 4 -->
      <circle cx="0" cy="75" r="7" fill="#3b82f6"/>
      <text x="20" y="80" fill="#93c5fd">GPIO 4 (SD)</text>
    </g>
  </g>
</svg>
