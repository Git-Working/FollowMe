<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="radarGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Radar Graphic (Right Side) -->
  <g transform="translate(940, 210)">
    <!-- Radar Waves -->
    <circle r="150" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.1"/>
    <circle r="115" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2"/>
    <circle r="80" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.35"/>
    <circle r="45" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.6"/>
    
    <!-- Radar Beam -->
    <path d="M 0 0 L 106 -106 A 150 150 0 0 0 -50 -141 Z" fill="url(#cyanGrad)" opacity="0.15"/>
    
    <!-- Center Dot -->
    <circle r="14" fill="url(#cyanGrad)" filter="url(#radarGlow)"/>
    <circle r="6" fill="#ffffff"/>

    <!-- Detected Node Points -->
    <g transform="translate(65, -45)">
      <circle r="8" fill="#34d399" filter="url(#glow)"/>
      <circle r="3" fill="#ffffff"/>
      <text x="14" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#34d399" font-weight="600">Living Room</text>
    </g>
    <g transform="translate(-70, 50)">
      <circle r="6" fill="#38bdf8" opacity="0.8"/>
      <text x="12" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Kitchen</text>
    </g>
    <g transform="translate(-40, -85)">
      <circle r="5" fill="#38bdf8" opacity="0.5"/>
      <text x="10" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Bedroom</text>
    </g>
  </g>

  <!-- Left Content / Title -->
  <g transform="translate(80, 110)">
    <!-- Pill Badge -->
    <rect width="180" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
    <circle cx="16" cy="16" r="5" fill="#34d399" filter="url(#glow)"/>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#38bdf8" font-weight="700" letter-spacing="1.5">SMART PRESENCE</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" fill="#ffffff" font-weight="900" letter-spacing="-1">
      FollowMe <tspan fill="url(#cyanGrad)">Smart Home</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#94a3b8" font-weight="400">
      Room-accurate smartphone presence (ESP32 RSSI), smart lighting automation
    </text>
    <text x="0" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#94a3b8" font-weight="400">
      &amp; acoustic double-clap control powered by Home Assistant
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 195)">
      <!-- Tag 1 -->
      <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">🎯 ESP32 RSSI</text>

      <!-- Tag 2 -->
      <rect x="142" width="160" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="156" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">💡 Light Follows Me</text>

      <!-- Tag 3 -->
      <rect x="314" width="150" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="328" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">👏 Double Clap</text>

      <!-- Tag 4 -->
      <rect x="476" width="150" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="490" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">🏠 Home Assistant</text>
    </g>
  </g>
</svg>
